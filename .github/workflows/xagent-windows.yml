name: xAgent Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'xagent-v*'
  pull_request:
    paths:
      - 'Agent/xAgent/**'
      - '.github/workflows/xagent-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Agent/xAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e . pyinstaller pillow pytest
      - name: Run tests
        run: python -m pytest
      - name: Create icon
        run: python packaging/make_icon.py
      - name: Build exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name xAgent --icon packaging/xagent.ico
          --collect-data xagent.tui
          --collect-all trafilatura
          --add-data "config.ini.example;."
          main.py
      - name: Smoke test CLI
        run: .\\dist\\xAgent\\xAgent.exe --list-tools
      - name: Compile setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" packaging\\xagent.iss
      - uses: actions/upload-artifact@v4
        with:
          name: xAgent-Windows-Setup
          path: Agent/xAgent/dist-installer/*.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/xagent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Agent/xAgent/dist-installer/*.exe
